name: Küre — GitHub Pages'e yayınla

on:
  push:
    branches:
      - claude/education-app-3d-animation-4jbbam
      - main
    paths:
      - 'kure/**'
      - '.github/workflows/kure-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kure/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: kure
        # Playwright yalnızca yerel test/kapak üretimi için; CI'da tarayıcı indirilmesin
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Üretim derlemesi
        working-directory: kure
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kure/dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
